# ACID//HUD theme (see `config-file = ?theme.conf` in ../config).
# Low fill: the window sits on hyprglass liquid glass (hypr/plugins.lua), which
# carries the darkening, blur and rim.
background-opacity=0.45
# The block cursor in the bright magenta (the palette's bright ANSI magenta)
# rather than the primary: over the dim glass it reads at a glance, and the
# CRT shader's bloom makes it glow a little.
cursor-color = #ff8fdc
cursor-text = #140a1c
cursor-opacity = 1
# 12 pt, not the shared 14: on the 1280 px laptop panel a half tile is then
# 64 columns instead of 51 and a full one 131 x 33. The size is repeated in
# fastfetch/config-acid.jsonc (FNT row), which cannot read it from here.
font-size = 12
window-padding-x = 12
window-padding-y = 10
window-padding-balance = true

# CRT scanlines + glow. Static shader, so no custom-shader-animation: the GPU
# stays idle while the terminal is idle.
custom-shader = ~/.config/ghostty/shaders/hud-crt.glsl
custom-shader-animation = false
