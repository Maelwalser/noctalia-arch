# ACID//HUD theme (see `config-file = ?theme.conf` in ../config).
# Low fill: the window sits on hyprglass liquid glass (hypr/plugins.lua), which
# carries the darkening, blur and rim.
background-opacity=0.45
window-padding-x = 12
window-padding-y = 10
window-padding-balance = true

# CRT scanlines + glow. Static shader, so no custom-shader-animation: the GPU
# stays idle while the terminal is idle.
custom-shader = ~/.config/ghostty/shaders/hud-crt.glsl
custom-shader-animation = false
