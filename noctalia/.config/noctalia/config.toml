# Noctalia v5 config, translated from the v4 settings.json in this folder.
# GUI changes are saved to ~/.local/state/noctalia/settings.toml and win over this file.

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale = 0.95                          # v4 general.scaleRatio

[shell]
font_family           = "JetBrainsMono Nerd Font"
corner_radius_scale   = 2.0              # v4 general.radiusRatio
time_format           = "{:%H:%M}"       # v4 use12hourFormat = false
telemetry_enabled     = false
show_location         = false            # v4 hideWeatherCityName
clipboard_enabled     = true             # v4 enableClipboardHistory
clipboard_auto_paste  = "off"            # v4 autoPasteClipboard = false
setup_wizard_enabled  = false
password_style        = "random"     # v4 passwordChars: random shapes instead of dots

[shell.animation]
enabled = false                          # v4 animationDisabled
speed   = 2.0

[shell.shadow]
direction = "down"                       # v4 shadowDirection = bottom

[shell.screen_corners]
enabled = false

[shell.panel]
transparency_mode              = "soft"  # v4 panelBackgroundOpacity 0.7 + translucentWidgets
borders                        = true    # v4 boxBorderEnabled
shadow                         = true    # v4 enableShadows
launcher_placement             = "floating"
launcher_position              = "center"
control_center_placement       = "attached"   # v4 panelsAttachedToBar
wallpaper_placement            = "attached"
session_placement              = "attached"
open_near_click_control_center = true    # v4 controlCenter.position = close_to_bar_button
list_item_background           = true    # v4 launcher rows: surface_variant cards

[shell.launcher]
categories    = false                    # v4 showCategories
compact       = true                     # name only, no description line (v4 density = compact)
show_app_origin_indicator = false        # v4 had no package-origin badges
sort_by_usage = true
pinned        = []
auto_paste    = "off"

[shell.launcher.providers.session]
global = true                            # v4 enableSessionSearch

[shell.launcher.providers.windows]
global = true                            # v4 enableWindowsSearch

[shell.window_switcher]
style = "carousel"                       # window snapshots; "compact" for a list
mru   = true                             # most recently used first
current_workspace_only = true            # only cycle windows on the active workspace
show_all_outputs       = false           # only windows on the focused monitor
show_caption           = false           # no window title under each card
show_count             = false           # no "2 / 5" position indicator

[shell.mpris]
blacklist = []

[shell.session]
grid           = false                   # v4 largeButtonsLayout = single-row
show_shortcuts = true                    # v4 showKeybinds

# v4 order and keybinds 1-7, each with the 5 s countdown
[[shell.session.actions]]
action = "lock"
shortcut = "1"
countdown_seconds = 5

[[shell.session.actions]]
action = "suspend"
shortcut = "2"
countdown_seconds = 5

[[shell.session.actions]]
action = "command"
command = "systemctl hibernate"
label = "Hibernate"
glyph = "snowflake"
shortcut = "3"
countdown_seconds = 5

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 5

[[shell.session.actions]]
action = "logout"
shortcut = "5"
countdown_seconds = 5

[[shell.session.actions]]
action = "shutdown"
shortcut = "6"
countdown_seconds = 5
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "systemctl reboot --firmware-setup"
label = "Reboot to UEFI"
glyph = "cpu"
shortcut = "7"
countdown_seconds = 5

# ── Keybinds (v4 vim-style extras) ────────────────────────────────────────────

[keybinds]
validate = ["Return", "KP_Enter"]
cancel   = ["Escape"]
delete   = ["Delete"]
left     = ["Left", "Ctrl+h"]
right    = ["Right", "Ctrl+l"]
up       = ["Up", "Ctrl+k"]
down     = ["Down", "Ctrl+j"]

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode             = "dark"
# Exact v4 palette: colors.json (generated by v4 from eyes.png with the
# "dysfunctional" scheme) plus v4's terminal colours, in palettes/v4-eyes.json.
# v5's own wallpaper generator gives slightly different secondary colours.
# For colours that follow the wallpaper again: source = "wallpaper", wallpaper_scheme = "dysfunctional"
source           = "custom"
custom_palette   = "v4-eyes"

[theme.templates]
enable_builtin_templates = true
# hyprland renders ~/.config/hypr/noctalia.lua, loaded at the end of hyprland.lua
builtin_ids              = ["hyprland", "ghostty"]

# btop: v5's built-in template derives two colours from the palette differently
# than v4 did, so this copy pins them to v4's values (selected_bg, div_line).
[theme.templates.user.btop]
input_path  = "templates/btop.theme"
output_path = "$XDG_CONFIG_HOME/btop/themes/noctalia.theme"
post_hook   = "bash /usr/share/noctalia/assets/templates/btop/apply.sh"

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled               = true
directory             = "/home/mael/Pictures/Wallpapers"
per_monitor_directories = false
fill_mode             = "crop"
fill_color            = "#000000"
transition            = ["fade", "disc", "stripes", "wipe", "honeycomb"]  # v4 "pixelate" has no v5 equivalent
transition_duration   = 1500
edge_smoothness       = 0.05
transition_on_startup = false            # v4 skipStartupTransition

[wallpaper.default]
path = "/home/mael/Pictures/Wallpapers/eyes.png"

[wallpaper.automation]
enabled          = false
interval_seconds = 300
order            = "random"

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.default]
position             = "top"
thickness            = 28                # v4 density = compact
background_opacity   = 0.3
compositor_blur      = true              # v4 enableBlurBehind
margin_ends          = 0                 # v4 barType = simple (full width, attached)
margin_edge          = 0
concave_edge_corners = true              # v4 outerCorners
padding              = 8
widget_spacing       = 3
font_scale           = 0.95              # v4 ui.fontDefaultScale
capsule              = true              # v4 showCapsule
capsule_opacity      = 0.8
auto_hide            = false             # v4 displayMode = always_visible
show_on_workspace_switch = true
reserve_space        = true

start  = ["clock", "media", "cpu", "temp", "ram", "active_window"]
center = ["workspaces"]
end    = ["tray", "notifications", "battery", "volume", "brightness", "control-center"]

[bar.default.dead_zone.actions]
right = "panel-toggle control-center"    # v4 rightClickAction = controlCenter

[widget.clock]
format         = "{:%H:%M %a, %b %d}"    # v4 "HH:mm ddd, MMM dd"
tooltip_format = "{:%H:%M %a, %b %d}"

[widget.media]
artist_first       = true
max_length         = 145
title_scroll       = "on_hover"
hide_when_no_media = true

[widget.active_window]
max_length       = 145
title_scroll     = "on_hover"
display          = "icon_and_text"
show_empty_label = false

[widget.workspaces]
font_weight               = 800          # v4 fontWeight = bold; 700 looks regular at this label size
label_source              = "id"         # v4 labelMode = index
max_label_chars           = 2
labels_only_when_occupied = true
hide_when_empty           = false        # v4 hideUnoccupied = false
focused_color             = "primary"
occupied_color            = "secondary"
empty_color               = "secondary"
focused_output_only       = false

[widget.tray]
drawer       = true
hide_passive = false
hidden       = []
pinned       = []

[widget.notifications]
hide_when_no_unread = false

[widget.battery]
display_mode = "graphic"                 # v4 graphic-clean
show_label   = false

[widget.volume]
show_label = false                       # v4 displayMode = onhover

[widget.brightness]
show_label = false

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled = false

# ── Desktop widgets (v4 eDP-1 layout) ─────────────────────────────────────────

[desktop_widgets]
enabled      = true
widget_order = ["weather_edp", "cpu_edp"]

[desktop_widgets.widget.weather_edp]
type   = "weather"
output = "eDP-1"
cx     = 240.0
cy     = 320.0

[desktop_widgets.widget.cpu_edp]
type   = "sysmon"
output = "eDP-1"
cx     = 240.0
cy     = 440.0

[desktop_widgets.widget.cpu_edp.settings]
stat = "cpu_usage"

# ── Control Center ────────────────────────────────────────────────────────────

[control_center]
hidden_tabs = ["weather", "calendar"]

[control_center.calendar]
show_events_card  = true
show_week_numbers = false

# v4 left + right shortcut rows (Noctalia Performance has no v5 equivalent)
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "wallpaper"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "power_profile"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "nightlight"

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon             = true
position                  = "top_right"
layer                     = "overlay"    # v4 overlayLayer
background_opacity        = 0.61
keep_dismissed_in_history = false        # v4 clearDismissed

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
enabled            = true
position           = "top_right"
hide_delay_ms      = 2000
background_opacity = 0.8

# v4 enabledTypes [0, 1, 2]: output volume, input volume, brightness
[osd.kinds]
volume             = true
volume_output      = true
volume_input       = true
brightness         = true
wifi               = false
bluetooth          = false
power_profile      = false
caffeine           = false
nightlight         = false
dnd                = false
lock_keys          = false
keyboard_layout    = false
keyboard_backlight = false
media              = false
privacy            = false

# ── Lock screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled             = true
lock_before_suspend = true               # v4 lockOnSuspend
fingerprint         = false              # v4 allowPasswordWithFprintd
blur_intensity      = 0.15
tint_intensity      = 0.05
transition          = []              # no lock/unlock animation

# ── Idle (v4: screen off 600 s, lock 660 s, suspend 1800 s, 5 s fade) ─────────

[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.screen-off]
action  = "screen_off"
enabled = true
timeout = 600

[idle.behavior.lock]
action  = "lock"
enabled = true
timeout = 660

[idle.behavior.lock-and-suspend]
action  = "lock_and_suspend"
enabled = true
timeout = 1800

# ── Services ──────────────────────────────────────────────────────────────────

[audio]
enable_overdrive = false
enable_sounds    = false                 # v4 volumeFeedback / notification sounds off

[brightness]
enable_ddcutil     = false
minimum_brightness = 0.01                # v4 enforceMinimum

[battery]
warning_threshold = 20

[nightlight]
enabled           = false
force             = false
temperature_day   = 6500
temperature_night = 4000

[location]
auto_locate = false
address     = "Bern"

[weather]
enabled = true
effects = true
unit    = "metric"

[calendar]
enabled = true                           # v4 showCalendarEvents

[system.monitor]
cpu_usage_activity_threshold     = 80.0
cpu_usage_critical_threshold     = 90.0
cpu_temp_activity_threshold      = 80.0
cpu_temp_critical_threshold      = 90.0
gpu_temp_activity_threshold      = 80.0
gpu_temp_critical_threshold      = 90.0
gpu_usage_activity_threshold     = 80.0
gpu_usage_critical_threshold     = 90.0
ram_pct_activity_threshold       = 80.0
ram_pct_critical_threshold       = 90.0
swap_pct_activity_threshold      = 80.0
swap_pct_critical_threshold      = 90.0
disk_used_pct_activity_threshold = 80.0
disk_used_pct_critical_threshold = 90.0

# ── Plugins (v4: file-search, screen-recorder; auto-update off) ───────────────

[plugins]
enabled = ["nightwatch75/file-search", "noctalia/screen_recorder"]
auto_update = "none"

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]
# v4 reloaded Hyprland after rewriting its colours; v5's hyprland template does
# not, so without this the borders keep stale colours until the next reload.
colors_changed = "hyprctl reload"

# ── Lock screen layout (v4 look) ──────────────────────────────────────────────
# v4: top card with "Welcome back, <user>!", the date and a bold stacked clock;
# bottom login panel with weather, password and session buttons (no media).

[lockscreen_widgets]
enabled      = true
widget_order = ["lock_card_dp2", "lock_welcome_dp2", "lock_date_dp2", "lock_time_dp2", "lockscreen-login-box@DP-2", "lock_card_dp4", "lock_welcome_dp4", "lock_date_dp4", "lock_time_dp4", "lockscreen-login-box@DP-4", "lock_card_edp1", "lock_welcome_edp1", "lock_date_edp1", "lock_time_edp1", "lockscreen-login-box@eDP-1"]

[lockscreen_widgets.widget.lock_card_dp2]
output   = "DP-2"
type = "label"
cx = 960.0
cy = 160.0
box_width = 540.0
box_height = 120.0

[lockscreen_widgets.widget.lock_card_dp2.settings]
title = " "
background_color = "surface"
background_opacity = 1.0
background_radius = 32.0
shadow = false

[lockscreen_widgets.widget.lock_welcome_dp2]
output   = "DP-2"
type = "label"
cx = 900.0
cy = 142.0
box_width = 380.0
box_height = 40.0

[lockscreen_widgets.widget.lock_welcome_dp2.settings]
title = "Welcome back, mael!"
background = false
shadow = false
color = "on_surface"

[lockscreen_widgets.widget.lock_date_dp2]
output   = "DP-2"
type = "clock"
cx = 838.0
cy = 182.0
box_width = 380.0
box_height = 30.0

[lockscreen_widgets.widget.lock_date_dp2.settings]
format = "{:%A, %B %-d}"
background = false
shadow = false
color = "on_surface_variant"

[lockscreen_widgets.widget.lock_time_dp2]
output   = "DP-2"
type = "clock"
cx = 1160.0
cy = 160.0
box_width = 90.0
box_height = 90.0

[lockscreen_widgets.widget.lock_time_dp2.settings]
format = "{:%H\n%M}"
center_text = true
background = false
shadow = false
color = "on_surface"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
type     = "login_box"
output   = "DP-2"
cx       = 960.0
cy       = 898.0
box_width  = 810.0
box_height = 196.0

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
layout               = "regular"
show_media           = false   # v4 enableLockScreenMediaControls = false
show_weather         = false
show_session_buttons = true    # v4 showSessionButtonsOnLockScreen
# v4 panel: solid surface; corners reduced from v4's 40 on request
background_color     = "surface"
background_opacity   = 1.0
background_radius    = 16.0
input_opacity        = 1.0
input_radius         = 12.0
show_login_button    = false   # no confirm button beside the password field
center_password_text = true    # password characters centred in the field
show_unlock_hint     = false   # hide the "type password and press enter" card; errors and Caps Lock still show

# DP-4 ultrawide: 2560x1080 logical (5120x2160 at scale 2). Same height as
# DP-2, so this is the DP-2 set shifted right by (2560 - 1920) / 2 = 320.
[lockscreen_widgets.widget.lock_card_dp4]
