# Noctalia v5 config, translated from the v4 settings.json in this folder.
# GUI changes are saved to ~/.local/state/noctalia/settings.toml and win over this file.
# Theme-specific settings (bar, widgets, palette, wallpaper, lockscreen) live in
# themes/<name>.toml; `dotfiles-theme <name>` links the active one as theme.toml.

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale = 0.95 # v4 general.scaleRatio

[shell]
font_family = "JetBrainsMono Nerd Font"
time_format = "{:%H:%M}"                # v4 use12hourFormat = false
telemetry_enabled = false
show_location = false                   # v4 hideWeatherCityName
clipboard_enabled = true                # v4 enableClipboardHistory
clipboard_auto_paste = "off"            # v4 autoPasteClipboard = false
setup_wizard_enabled = false
password_style = "random"               # v4 passwordChars: random shapes instead of dots

[shell.shadow]
direction = "down" # v4 shadowDirection = bottom

[shell.screen_corners]
enabled = false

[shell.panel]
transparency_mode = "soft"            # v4 panelBackgroundOpacity 0.7 + translucentWidgets
borders = true                        # v4 boxBorderEnabled
shadow = true                         # v4 enableShadows
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached" # v4 panelsAttachedToBar
wallpaper_placement = "attached"
session_placement = "attached"
open_near_click_control_center = true # v4 controlCenter.position = close_to_bar_button
list_item_background = true           # v4 launcher rows: surface_variant cards

[shell.launcher]
categories = false                # v4 showCategories
compact = true                    # name only, no description line (v4 density = compact)
show_app_origin_indicator = false # v4 had no package-origin badges
sort_by_usage = true
pinned = []
auto_paste = "off"

[shell.launcher.providers.session]
global = true # v4 enableSessionSearch

[shell.launcher.providers.windows]
global = true # v4 enableWindowsSearch

[shell.window_switcher]
style = "carousel"            # window snapshots; "compact" for a list
mru = true                    # most recently used first
current_workspace_only = true # only cycle windows on the active workspace
show_all_outputs = false      # only windows on the focused monitor
show_caption = false          # no window title under each card
show_count = false            # no "2 / 5" position indicator

[shell.mpris]
blacklist = []

[shell.session]
grid = false          # v4 largeButtonsLayout = single-row
show_shortcuts = true # v4 showKeybinds

# v4 order and keybinds 1-7, each with the 5 s countdown
[[shell.session.actions]]
action = "lock"
shortcut = "1"
countdown_seconds = 5

[[shell.session.actions]]
action = "suspend"
shortcut = "2"
countdown_seconds = 5

[[shell.session.actions]]
action = "command"
command = "systemctl hibernate"
label = "Hibernate"
glyph = "snowflake"
shortcut = "3"
countdown_seconds = 5

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 5

[[shell.session.actions]]
action = "logout"
shortcut = "5"
countdown_seconds = 5

[[shell.session.actions]]
action = "shutdown"
shortcut = "6"
countdown_seconds = 5
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "systemctl reboot --firmware-setup"
label = "Reboot to UEFI"
glyph = "cpu"
shortcut = "7"
countdown_seconds = 5

# ── Keybinds (v4 vim-style extras) ────────────────────────────────────────────

[keybinds]
validate = ["Return", "KP_Enter"]
cancel = ["Escape"]
delete = ["Delete"]
left = ["Left", "Ctrl+h"]
right = ["Right", "Ctrl+l"]
up = ["Up", "Ctrl+k"]
down = ["Down", "Ctrl+j"]

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode = "dark"

[theme.templates]
enable_builtin_templates = true
# hyprland renders ~/.config/hypr/noctalia.lua, loaded at the end of hyprland.lua.
# gtk3/gtk4 write noctalia.css next to the stowed gtk.css (which imports it) and
# switch gtk-theme to adw-gtk3-dark; qt writes the qt6ct colour scheme that the
# stowed qt6ct.conf points at.
builtin_ids = ["hyprland", "ghostty", "gtk3", "gtk4", "qt"]

# btop: own copy of the built-in template (selected_bg / div_line roles differ).
[theme.templates.user.btop]
input_path = "templates/btop.theme"
output_path = "$XDG_CONFIG_HOME/btop/themes/noctalia.theme"
post_hook = "bash /usr/share/noctalia/assets/templates/btop/apply.sh"

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled = true
directory = "/home/mael/Pictures/Wallpapers"
per_monitor_directories = false
fill_mode = "crop"
fill_color = "#000000"
edge_smoothness = 0.05
transition_on_startup = false # v4 skipStartupTransition

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"

# Bar, bar widgets, desktop widgets and the lock screen: themes/<name>.toml

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled = false

# ── Control Center ────────────────────────────────────────────────────────────

[control_center]
hidden_tabs = ["weather", "calendar"]

[control_center.calendar]
show_events_card = true
show_week_numbers = false

# v4 left + right shortcut rows (Noctalia Performance has no v5 equivalent)
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "wallpaper"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "power_profile"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "nightlight"

# ── Notifications ─────────────────────────────────────────────────────────────

# Kept small and brief: one toast on the focused monitor, at most three, gone
# after 3.5 s. Everything still lands in the history behind the bar indicator.
[notification]
enable_daemon = true
position = "top_right"
layer = "top"                     # not over fullscreen video and games
follow_focused_output = true      # only on the monitor in use, not on every output
max_visible = 3                   # further toasts queue instead of filling the column
show_actions = false              # click runs the default action, right-click dismisses
show_app_name = false             # the icon already names the sender
width = 300
keep_dismissed_in_history = false # v4 clearDismissed
# First matching filter wins. override_duration also cuts critical toasts
# short, and allowed_urgencies cannot scope a filter (it suppresses the other
# levels outright), so the senders whose warnings must stay up come first.
filter_order = ["keep_battery", "keep_calendar", "brief"]

[notification.filter.keep_battery] # Noctalia's low/critical battery warnings keep their own timing
enabled = true
match = "battery"

[notification.filter.keep_calendar] # calendar reminders too
enabled = true
match = "calendar"

[notification.filter.brief]        # everyone else: 3.5 s, and never sticky
enabled = true
match_content = ".*"
override_duration = 3500
allow_permanent = false

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
enabled = true
position = "top_right"
hide_delay_ms = 2000

# v4 enabledTypes [0, 1, 2]: output volume, input volume, brightness
[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = false
bluetooth = false
power_profile = false
caffeine = false
nightlight = false
dnd = false
lock_keys = false
keyboard_layout = false
keyboard_backlight = false
media = false
privacy = false

# ── Idle (v4: screen off 600 s, lock 660 s, suspend 1800 s, 5 s fade) ─────────

[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 600

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 660

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1800

# ── Services ──────────────────────────────────────────────────────────────────

[audio]
enable_overdrive = false
enable_sounds = false    # v4 volumeFeedback / notification sounds off

[brightness]
enable_ddcutil = false
minimum_brightness = 0.01 # v4 enforceMinimum

[battery]
warning_threshold = 20

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

[location]
auto_locate = false
address = "Bern"

[weather]
enabled = true
effects = true
unit = "metric"

[calendar]
enabled = true # v4 showCalendarEvents

[system.monitor]
cpu_usage_activity_threshold = 80.0
cpu_usage_critical_threshold = 90.0
cpu_temp_activity_threshold = 80.0
cpu_temp_critical_threshold = 90.0
gpu_temp_activity_threshold = 80.0
gpu_temp_critical_threshold = 90.0
gpu_usage_activity_threshold = 80.0
gpu_usage_critical_threshold = 90.0
ram_pct_activity_threshold = 80.0
ram_pct_critical_threshold = 90.0
swap_pct_activity_threshold = 80.0
swap_pct_critical_threshold = 90.0
disk_used_pct_activity_threshold = 80.0
disk_used_pct_critical_threshold = 90.0

# ── Plugins (v4: file-search, screen-recorder; auto-update off) ───────────────

[plugins]
auto_update = "none"

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]
# v4 reloaded Hyprland after rewriting its colours; v5's hyprland template does
# not, so without this the borders keep stale colours until the next reload.
colors_changed = "hyprctl reload"

