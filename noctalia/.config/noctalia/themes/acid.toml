  "hud_net_rx_edp1",
  "hud_swap_pct_edp1",
  "lockscreen-login-box@eDP-1",
  "hud_static_u4025qw",
  "hud_reticle_u4025qw",
  "hud_time_u4025qw",
  "hud_seconds_u4025qw",
  "hud_date_u4025qw",
  "hud_week_u4025qw",
  "hud_cpu_usage_u4025qw",
