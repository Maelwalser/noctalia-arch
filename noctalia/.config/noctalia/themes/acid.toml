# ── ACID//HUD theme ─────────────────────────────────────────────────────────
# Theme fragment, selected by `dotfiles-theme acid`: it links this file to
# ~/.config/noctalia/theme.toml. Noctalia merges every *.toml in its config dir in
# name order, so these keys override the shared config.toml.

[shell]
corner_radius_scale = 2.25              # ACID//HUD: 18 px liquid-glass corners on toasts/panels; the bar rail matches (its own `radius`)
# The HUD readout face for all of Noctalia's own UI. It is also the only font
# the lockscreen's password field and power buttons use (no per-widget option).
# Terminal and editor fonts are configured elsewhere and stay JetBrainsMono.
font_family = "Departure Mono"

# Panels (control centre, session, wallpaper) are liquid glass too (hyprglass):
# translucent cards, no shadow, the rim comes from the plugin.
[shell.panel]
transparency_mode = "glass"
shadow = false

[shell.animation]
enabled = true # ACID//HUD: ambient motion on panels/OSD; speed keeps it snappy
speed = 1.6

[theme]
# ACID//HUD: near-black + bone white with one acid accent (palettes/acid-hud.json).
# The GUI writes [theme] into ~/.local/state/noctalia/settings.toml, which wins
# over this file; `dotfiles-theme` keeps one copy of that state per theme.
source = "custom"
custom_palette = "acid-hud"

# ACID//HUD: palette as JSON for the Quickshell overlay (live-reloaded) and for
# hud-build, which re-tints the bar frames, stickers and wallpapers from it.
# Detached: a re-tint takes ~40 s and Noctalia kills hooks after 5 s.
[theme.templates.user.hud_colors]
input_path = "templates/hud-colors.json"
output_path = "$XDG_CONFIG_HOME/hud/colors.json"
post_hook = "setsid -f sh -c 'd=\"${XDG_CACHE_HOME:-$HOME/.cache}/hud\"; mkdir -p \"$d\" && hud-build --tint-only --if-changed >\"$d/hook.log\" 2>&1'"
hook_async = true

[theme.templates.user.tmux]
input_path = "templates/tmux.conf"
output_path = "$XDG_CONFIG_HOME/tmux/noctalia.conf"
post_hook = "tmux source-file ~/.tmux.conf 2>/dev/null || true"

[theme.templates.user.nvim]
input_path = "templates/nvim-palette.lua"
output_path = "$XDG_DATA_HOME/hud/nvim-palette.lua"

[wallpaper]
transition = [
  "stripes",
  "wipe",
  "honeycomb",
] # ACID//HUD: hard-edged reveals only
transition_duration = 900

# The neon alley photo the palette is sampled from, on every output. No
# per-connector entries: they pinned the dock's monitors to the old HUD render
# while the laptop moved on (Noctalia cover-crops the photo to any aspect).
[wallpaper.default]
path = "/home/mael/Pictures/Wallpapers/wallhaven-zpvj1g.png"

# ACID//HUD: toasts drop out of the bar's right end as liquid glass. The fill
# is kept faint so hyprglass (hypr/plugins.lua) shows the desktop behind it,
# bent and lit at the rim; it must stay above that layer's mask_threshold.
[notification]
background_opacity = 0.1
border = false                     # hyprglass draws the lit rim
offset_x = 8                       # right edge flush with the bar (bar margin_ends)
offset_y = 8                       # window tops sit at bar + gaps_out (8): the toast top lines up with them

# Any OSD still enabled is the same glass as the toasts and sits in their place,
# flush under the bar's right end. (The media keys show a toast: hud-osd.)
[osd]
background_opacity = 0.1
border = false                     # hyprglass draws the lit rim
offset_x = 8
offset_y = 8

[plugins]
# mael/hud comes from the local path source "hud" (registered by setup.sh).
enabled = ["nightwatch75/file-search", "noctalia/screen_recorder", "mael/hud"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.default]
position = "top"
thickness = 32
# ACID//HUD: a floating instrument rail. Square hairline panels group related
# readouts; the HUD ornaments (mael/hud:*) float between them without a box.
# The rail is clear liquid glass (hyprglass, hypr/plugins.lua): faint fill, no
# shadow and no border, the plugin lights the rim.
background_opacity = 0.1
compositor_blur = true
shadow = false
margin_ends = 8
margin_edge = 6
concave_edge_corners = false
radius = 18                        # the toast corner radius: on the 32 px rail this is a full pill
border = "outline_variant"
border_width = 0
padding = 10                       # the end widgets clear the rounded ends
widget_spacing = 6
font_scale = 0.97                  # v4 ui.fontDefaultScale
color = "on_surface"               # values off-white ...
icon_color = "primary"             # ... glyphs acid
capsule = true
capsule_radius = 12                # pills inside the pill rail
capsule_fill = "#ffffff"           # nested glass: a light lozenge over the rail; hyprglass traces
capsule_opacity = 0.12             # it (mask_nested in hypr/plugins.lua) and lights its rim itself,
capsule_border = "#ffffff00"       # so no drawn border
capsule_border_width = 0
capsule_padding = 8
auto_hide = false                  # v4 displayMode = always_visible
show_on_workspace_switch = true
reserve_space = true

# hud_* are the ACID//HUD ornaments (plugin mael/hud) (hud/.local/share/hud-src/noctalia-plugins).
start = [
  "hud_emblem",
  "hud_hazard",
  "group:clk",
  "group:sys",
  "media",
  "hud_title",
]
center = ["hud_workspaces"]
end = ["hud_eq", "tray", "group:ctl", "hud_spinner", "control-center"]

# Each panel opens with an acid tag (mael/hud:tag), like the overlay's section
# headers, and hairline dividers (mael/hud:sep) split the readouts.
[[bar.default.capsule_group]]
id = "clk"
members = ["hud_tag_clk", "clock"]
fill = "#ffffff"
opacity = 0.12
border = "#ffffff00"
radius = 12
padding = 8
widget_spacing = 8

# System readouts share one panel as plain values (a sparkline is a dark box
# on the glass; three graphs also overflow the start lane on the 1280 px laptop).
[[bar.default.capsule_group]]
id = "sys"
members = ["hud_tag_sys", "cpu", "hud_sep", "temp", "hud_sep", "ram"]
fill = "#ffffff"
opacity = 0.12
border = "#ffffff00"
radius = 12
padding = 8
widget_spacing = 8

[[bar.default.capsule_group]]
id = "ctl"
members = ["hud_tag_ctl", "hud_msg", "hud_sep", "hud_vol", "hud_sep", "hud_lum", "hud_sep", "hud_pwr"]
fill = "#ffffff"
opacity = 0.12
border = "#ffffff00"
radius = 12
padding = 8
widget_spacing = 8

# The 1280 px laptop panel has no room between the system panel and the
# centred workspaces (about 10 px), so the window title and the media readout
# (which would overlap the workspace row) only show on the ultrawides.
[bar.default.monitor.laptop]
match = "eDP-1"
start = ["hud_emblem", "hud_hazard", "group:clk", "group:sys"]

[bar.default.dead_zone.actions]
right = "panel-toggle control-center" # v4 rightClickAction = controlCenter

[widget.hud_emblem]
type = "mael/hud:emblem"
capsule = false

[widget.hud_hazard]
type = "mael/hud:hazard"
capsule = false

# Oscilloscope traces on the PipeWire spectrum (a calm ripple when silent).
[widget.hud_eq]
type = "mael/hud:eq"
capsule = false

# Focused window title, as wide as the room before the centred workspaces
# allows (Noctalia's active_window only takes one fixed max_length).
[widget.hud_title]
type = "mael/hud:title"
capsule = false

[widget.hud_spinner]
type = "mael/hud:spinner"
capsule = false

# Slanted HUD tiles replace the built-in pills (Noctalia's own workspace widget
# has no shape or glyph options).
[widget.hud_workspaces]
type = "mael/hud:workspaces"
capsule = false

# Pixel-icon readouts with Departure Mono values replace the built-in glyphs.
[widget.hud_msg]
type = "mael/hud:msg"

[widget.hud_vol]
type = "mael/hud:vol"

[widget.hud_lum]
type = "mael/hud:lum"

[widget.hud_pwr]
type = "mael/hud:pwr"

[widget.hud_tag_clk]
type = "mael/hud:tag"

[widget.hud_tag_sys]
type = "mael/hud:tag"

[widget.hud_tag_ctl]
type = "mael/hud:tag"

[widget.hud_sep]
type = "mael/hud:sep"

[widget.clock]
format = "{:%H:%M}"
font_family = "Departure Mono"     # the HUD readout face
tooltip_format = "{:%A %d %B %Y}" # the date lives here, on the overlay and on the lockscreen

[widget.cpu]
stat = "cpu_usage"
visualization = "none"
show_glyph = false
custom_label = "CPU"
label_min_width = 26
font_family = "Departure Mono"     # the HUD readout face, as on the mael/hud widgets
font_scale = 0.88

[widget.temp]
stat = "cpu_temp"
show_glyph = false
custom_label = "TMP"
label_min_width = 34
font_family = "Departure Mono"     # the HUD readout face, as on the mael/hud widgets
font_scale = 0.88
visualization = "none"

[widget.ram]
stat = "ram_pct"
show_glyph = false
custom_label = "MEM"
label_min_width = 30
font_family = "Departure Mono"     # the HUD readout face, as on the mael/hud widgets
font_scale = 0.88
visualization = "none"

[widget.media]
artist_first = true
max_length = 145
title_scroll = "on_hover"
hide_when_no_media = true
capsule = false


[widget.tray]
drawer = true
hide_passive = false
hidden = []
pinned = []

[widget.control-center]
custom_image = "/home/mael/.local/share/hud/bar/control-center.png" # 32 px copy for the 16 px button (hud-build)

# ── Desktop widgets ───────────────────────────────────────────────────────────
# The ACID//HUD Quickshell overlay (quickshell/.config/quickshell/hud) draws the
# desktop readouts now; the v4 weather/sysmon widgets would sit on top of it.

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

# ── Lock screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled = true
lock_before_suspend = true # v4 lockOnSuspend
fingerprint = false        # v4 allowPasswordWithFprintd
# Dedicated quiet backdrop from hud-build; the lockscreen widgets supply the
# structure, so it stays sharp (no blur or tint).
wallpaper = "/home/mael/.local/share/hud/lock/backdrop.png"
blur_intensity = 0.0
tint_intensity = 0.0
# No built-in transition: the unlock reveal is the HUD overlay's glass fold
# (quickshell/hud/UnlockFold.qml), driven by the session hooks below. Noctalia
# plays its exit transition before the compositor unlocks, so any entry here
# would run first and show its stale desktop capture under the fold.
transition = []

[hooks]
session_locked = "qs -c hud ipc call lock locked"
# After the unlock (detached: hooks are cut off after 5 s), set up a monitor
# that was plugged in while the session was locked: hud-build --lock-sync
# restarts Noctalia for a new lock layout, which it must not do under the lock.
session_unlocked = '''sh -c 'qs -c hud ipc call lock unlocked; setsid -f sh -c "sleep 3; exec $HOME/.local/bin/hud-build --lock-sync >/dev/null 2>&1"' '''

# ── Lock screen layout (ACID//HUD) ────────────────────────────────────────────
# GENERATED by `hud-build --lock-layout` (layout spec: LOCK_* in hud-build), which
# also renders the static art each output's `hud_static_*` sticker shows. Edit
# the spec there and regenerate rather than moving widgets by hand, or the live
# widgets drift off the art beneath them.

[lockscreen_widgets]
enabled = true
schema_version = 2 # current layout schema; without it noctalia migrates the table into state
widget_order = [
  "hud_static_edp1",
  "lockscreen-login-box@eDP-1",
  "hud_static_u4025qw",
  "lockscreen-login-box@U4025QW",
  "hud_static_zowie",
  "lockscreen-login-box@ZOWIE",
]

[lockscreen_widgets.widget.hud_static_edp1]
output = "eDP-1"
type = "sticker"
cx = 640.0
cy = 400.0
box_width = 1280.0
box_height = 800.0
[lockscreen_widgets.widget.hud_static_edp1.settings]
image_path = "/home/mael/.local/share/hud/lock/static-eDP-1.png"
background = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
output = "eDP-1"
type = "login_box"
cx = 640.0
cy = 676.0
box_width = 480.0
box_height = 72.0
[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "compact"
show_media = false
show_weather = false
show_session_buttons = false
background_color = "surface"
background_opacity = 0.0
background_radius = 18.0
input_opacity = 0.35
input_radius = 12.0
show_login_button = false
show_password_reveal = false
center_password_text = true
show_unlock_hint = false

