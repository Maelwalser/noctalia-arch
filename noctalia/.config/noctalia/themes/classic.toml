# ── Classic theme (the v4 look from before ACID//HUD) ───────────────────────
# Theme fragment, selected by `dotfiles-theme classic`: it links this file to
# ~/.config/noctalia/theme.toml. Noctalia merges every *.toml in its config dir in
# name order, so these keys override the shared config.toml.

[shell]
corner_radius_scale   = 2.0              # v4 general.radiusRatio

[shell.animation]
enabled = false                          # v4 animationDisabled
speed   = 2.0

[theme]
# Exact v4 palette: colors.json (generated by v4 from eyes.png with the
# "dysfunctional" scheme) plus v4's terminal colours, in palettes/v4-eyes.json.
# v5's own wallpaper generator gives slightly different secondary colours.
# For colours that follow the wallpaper again: source = "wallpaper", wallpaper_scheme = "dysfunctional"
source           = "custom"
custom_palette   = "v4-eyes"

[wallpaper]
transition            = ["fade", "disc", "stripes", "wipe", "honeycomb"]  # v4 "pixelate" has no v5 equivalent
transition_duration   = 1500

[wallpaper.default]
path = "/home/mael/Pictures/Wallpapers/eyes.png"

[notification]
background_opacity        = 0.61

[osd]
background_opacity = 0.8

[plugins]
enabled = ["nightwatch75/file-search", "noctalia/screen_recorder"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.default]
position             = "top"
thickness            = 28                # v4 density = compact
background_opacity   = 0.3
compositor_blur      = true              # v4 enableBlurBehind
margin_ends          = 0                 # v4 barType = simple (full width, attached)
margin_edge          = 0
concave_edge_corners = true              # v4 outerCorners
padding              = 8
widget_spacing       = 3
font_scale           = 0.95              # v4 ui.fontDefaultScale
capsule              = true              # v4 showCapsule
capsule_opacity      = 0.8
auto_hide            = false             # v4 displayMode = always_visible
show_on_workspace_switch = true
reserve_space        = true

start  = ["clock", "media", "cpu", "temp", "ram", "active_window"]
center = ["workspaces"]
end    = ["tray", "notifications", "battery", "volume", "brightness", "control-center"]

[bar.default.dead_zone.actions]
right = "panel-toggle control-center"    # v4 rightClickAction = controlCenter

[widget.clock]
format         = "{:%H:%M %a, %b %d}"    # v4 "HH:mm ddd, MMM dd"
tooltip_format = "{:%H:%M %a, %b %d}"

[widget.media]
artist_first       = true
max_length         = 145
title_scroll       = "on_hover"
hide_when_no_media = true

[widget.active_window]
max_length       = 145
title_scroll     = "on_hover"
display          = "icon_and_text"
show_empty_label = false

[widget.workspaces]
font_weight               = 800          # v4 fontWeight = bold; 700 looks regular at this label size
label_source              = "id"         # v4 labelMode = index
max_label_chars           = 2
labels_only_when_occupied = true
hide_when_empty           = false        # v4 hideUnoccupied = false
focused_color             = "primary"
occupied_color            = "secondary"
empty_color               = "secondary"
focused_output_only       = false

[widget.tray]
drawer       = true
hide_passive = false
hidden       = []
pinned       = []

[widget.notifications]
hide_when_no_unread = false

[widget.battery]
display_mode = "graphic"                 # v4 graphic-clean
show_label   = false

[widget.volume]
show_label = false                       # v4 displayMode = onhover

[widget.brightness]
show_label = false

# ── Desktop widgets (v4 eDP-1 layout) ─────────────────────────────────────────

[desktop_widgets]
enabled      = true
widget_order = ["weather_edp", "cpu_edp"]

[desktop_widgets.widget.weather_edp]
type   = "weather"
output = "eDP-1"
cx     = 240.0
cy     = 320.0

[desktop_widgets.widget.cpu_edp]
type   = "sysmon"
output = "eDP-1"
cx     = 240.0
cy     = 440.0

[desktop_widgets.widget.cpu_edp.settings]
stat = "cpu_usage"

# ── Lock screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled             = true
lock_before_suspend = true               # v4 lockOnSuspend
fingerprint         = false              # v4 allowPasswordWithFprintd
blur_intensity      = 0.15
tint_intensity      = 0.05
transition          = []              # no lock/unlock animation

# ── Lock screen layout (v4 look) ──────────────────────────────────────────────
# v4: top card with "Welcome back, <user>!", the date and a bold stacked clock;
# bottom login panel with weather, password and session buttons (no media).

[lockscreen_widgets]
enabled      = true
widget_order = ["lock_card_dp2", "lock_welcome_dp2", "lock_date_dp2", "lock_time_dp2", "lockscreen-login-box@DP-2", "lock_card_dp4", "lock_welcome_dp4", "lock_date_dp4", "lock_time_dp4", "lockscreen-login-box@DP-4", "lock_card_edp1", "lock_welcome_edp1", "lock_date_edp1", "lock_time_edp1", "lockscreen-login-box@eDP-1"]

[lockscreen_widgets.widget.lock_card_dp2]
output   = "DP-2"
type = "label"
cx = 960.0
cy = 160.0
box_width = 540.0
box_height = 120.0

[lockscreen_widgets.widget.lock_card_dp2.settings]
title = " "
background_color = "surface"
background_opacity = 1.0
background_radius = 32.0
shadow = false

[lockscreen_widgets.widget.lock_welcome_dp2]
output   = "DP-2"
type = "label"
cx = 900.0
cy = 142.0
box_width = 380.0
box_height = 40.0

[lockscreen_widgets.widget.lock_welcome_dp2.settings]
title = "Welcome back, mael!"
background = false
shadow = false
color = "on_surface"

[lockscreen_widgets.widget.lock_date_dp2]
output   = "DP-2"
type = "clock"
cx = 838.0
cy = 182.0
box_width = 380.0
box_height = 30.0

[lockscreen_widgets.widget.lock_date_dp2.settings]
format = "{:%A, %B %-d}"
background = false
shadow = false
color = "on_surface_variant"

[lockscreen_widgets.widget.lock_time_dp2]
output   = "DP-2"
type = "clock"
cx = 1160.0
cy = 160.0
box_width = 90.0
box_height = 90.0

[lockscreen_widgets.widget.lock_time_dp2.settings]
format = "{:%H\n%M}"
center_text = true
background = false
shadow = false
color = "on_surface"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
type     = "login_box"
output   = "DP-2"
cx       = 960.0
cy       = 898.0
box_width  = 810.0
box_height = 196.0

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
layout               = "regular"
show_media           = false   # v4 enableLockScreenMediaControls = false
show_weather         = false
show_session_buttons = true    # v4 showSessionButtonsOnLockScreen
# v4 panel: solid surface; corners reduced from v4's 40 on request
background_color     = "surface"
background_opacity   = 1.0
background_radius    = 16.0
input_opacity        = 1.0
input_radius         = 12.0
show_login_button    = false   # no confirm button beside the password field
center_password_text = true    # password characters centred in the field
show_unlock_hint     = false   # hide the "type password and press enter" card; errors and Caps Lock still show

# DP-4 ultrawide: 2560x1080 logical (5120x2160 at scale 2). Same height as
# DP-2, so this is the DP-2 set shifted right by (2560 - 1920) / 2 = 320.
