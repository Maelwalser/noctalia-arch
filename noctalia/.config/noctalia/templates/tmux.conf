# Generated by Noctalia from templates/tmux.conf (ACID//HUD). Do not edit the output.
set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] ▲ #S #[bg={{colors.surface.default.hex}},fg={{colors.primary.default.hex}}]◤ "
set -g status-left-length 30
set -g status-right "#[fg={{colors.outline.default.hex}}]//// #[fg={{colors.on_surface_variant.default.hex}}]%Y-%m-%d #[fg={{colors.surface_variant.default.hex}}]◢#[bg={{colors.surface_variant.default.hex}},fg={{colors.on_surface.default.hex}},bold] %H:%M "
set -g window-status-format "#[fg={{colors.outline.default.hex}}]#I #[fg={{colors.on_surface_variant.default.hex}}]#W "
set -g window-status-current-format "#[fg={{colors.surface.default.hex}},bg={{colors.primary.default.hex}}]◤#[fg={{colors.on_primary.default.hex}},bold] #I #W #[bg={{colors.surface.default.hex}},fg={{colors.primary.default.hex}}]◤"
set -g window-status-separator ""
set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g message-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g mode-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.outline.default.hex}}"
set -g clock-mode-colour "{{colors.primary.default.hex}}"
set -g status-right-style default
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-bell-style "fg={{colors.on_primary.default.hex}},bg={{colors.error.default.hex}},bold"
