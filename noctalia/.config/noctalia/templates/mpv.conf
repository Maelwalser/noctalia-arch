script-opts-append=uosc-chapter_ranges=openings:{{colors.terminal_normal_blue.default.hex_stripped}}64,endings:{{colors.terminal_normal_blue.default.hex_stripped}}64,ads:{{colors.error.default.hex_stripped}}80
osd-color="{{colors.on_surface.default.hex}}"
