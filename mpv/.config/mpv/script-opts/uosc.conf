# A thin bar: a 2 px progress strip that grows into a slim timeline near the
# pointer, and a handful of controls. Colours come from ~~/noctalia.conf.
timeline_style=bar
timeline_size=28
timeline_border=0
progress=always
progress_size=2

controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_chapter>chapters,space,<video,audio>speed,gap,prev,items,next,gap,fullscreen
controls_size=24
controls_margin=6
controls_spacing=2

volume=right
volume_size=28
volume_border=0

top_bar=no-border
top_bar_size=28
top_bar_controls=no
window_border_size=0

menu_item_height=28
border_radius=2
text_border=1
font_bold=no
# Glass-like: the bar tints the picture instead of covering it.
opacity=timeline=0.55,controls=0,position=1,chapters=0.6,slider=0.55,slider_gauge=1,speed=0.5,menu=0.9,title=0.6,tooltip=0.9,curtain=0.4,idle_indicator=0.6,audio_indicator=0.4,buffering_indicator=0.3,playlist_position=0.6
pause_indicator=flash
destination_time=total
