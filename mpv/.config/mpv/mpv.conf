# uosc (AUR: mpv-uosc) replaces the stock controller; see script-opts/uosc.conf.
osc=no
osd-bar=no
border=no

osd-font="Departure Mono"
# Departure Mono is a pixel font on an 11 px grid; multiples stay crisp.
osd-font-size=22
osd-border-size=1

# Palette from Noctalia (templates/mpv.conf). A missing file only logs an error.
include="~~/noctalia.conf"
