# ACID//HUD element manifest.
#
# The vector packs in ~/Pictures/ricing are licensed stock art, and this repo is
# public, so the repo only records *where* each element sits on its sheet.
# `hud-build` crops them locally into ~/.local/share/hud/elements/<name>.png as
# white-on-transparent masks that the overlay and the tint step recolour.
#
# box = [x, y, w, h] in sheet points (the PDF that ghostscript makes from the
# EPS, 72 pt per inch). size = longest edge of the output in pixels.
# level = "lo%,hi%" luminance window that becomes alpha 0..1; anything darker
# than lo (the sheet background, faint guide grids) drops out.
# erase = [[x, y, w, h], ...] clears neighbouring glyphs that fall inside box.
# center = "circle" | "bbox" re-pads the output to a square canvas centred on the
# element: "circle" fits the dominant circle (rings whose decoration is lopsided),
# "bbox" uses the visible extent. Anything that rotates or stacks concentrically
# needs it, or it wobbles around its canvas centre.

[sheets.hud]
dir = "cyberpunk-hud-design-elements"
mode = "light"
level = "30%,90%"

[sheets.icons]
dir = "white-cyberpunk-hud-icons-black-background"
mode = "light"
level = "30%,90%"

[sheets.ui]
dir = "futuristic-user-interface-elements-vector-set"
mode = "light"
level = "15%,85%"

[sheets.wire]
dir = "y2k-grid-abstract-shape-design-elements"
mode = "light"
level = "17%,50%"

[sheets.retro]
dir = "retro-futuristic-black-icons-set"
mode = "dark"
level = "10%,80%"

[sheets.brut]
dir = "brutalism-template-design"
mode = "light"
level = "20%,85%"

[sheets.y2k]
dir = "y2k-aesthetic-element-pack"
mode = "light"
level = "25%,70%"

[sheets.y2kicons]
dir = "y2k-icons-design-template"
mode = "light"
level = "15%,55%"

# Wallpaper textures: whole-sheet fields, cropped and masked by hud-build.
[sheets.terrain]
dir = "point-wave-threads-texture-abstract-dot-background-technological-cyberspace-background"
mode = "light"
level = "20%,95%"

[sheets.mesh]
dir = "abstract-monochrome-distorted-mesh-plane-dark-background-futuristic-style-card-elegant-background-bu"
mode = "light"
level = "8%,45%"

[sheets.poster]
dir = "cyberpunk-retro-futuristic-poster-vector-illustration"
mode = "light"
level = "15%,95%"

[sheets.grunge]
dir = "grunge-background-with-neon-paint-splatters"
mode = "light"
level = "25%,70%"

