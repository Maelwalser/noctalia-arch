# ACID//HUD bar ornaments. Frames and tinted images are rendered locally by
# `hud-build` into ~/.local/share/hud/bar (derived from licensed stock art, so
# they are not shipped with the plugin). Animation is frame swapping through
# barWidget.render + noctalia.setUpdateInterval: the bar API has no transforms.
#
# hover_highlight = false on every widget (plugin_api 34): the bar's own hover
# pill makes hyprglass trace a new glass pill around a bare ornament and does
# not line up with the grouped pills. On hover the readouts make their text
# and icons glow instead (common.luau glow); the ornaments show nothing.
id = "mael/hud"
name = "ACID//HUD"
version = "1.0.0"
plugin_api = 34
author = "mael"
license = "MIT"
dependencies = []
tags = ["theme", "decoration", "workspaces", "system"]
icon = "hexagon"
description = "Cyberpunk HUD bar: emblem, hazard tape, spinning ring, barcode, slanted workspace tiles, clock and system panels, and pixel readouts for volume, brightness, battery and notifications."

[[widget]]
id = "emblem"
entry = "emblem.luau"
hover_highlight = false

  [widget.actions]
  left = "panel-toggle launcher"
  middle = "none"

[[widget]]
id = "hazard"
entry = "hazard.luau"
hover_highlight = false

  [[widget.setting]]
  key = "animate"
  type = "bool"
  label_key = "settings.animate.label"
  default = true

  [[widget.setting]]
  key = "length"
  type = "int"
  label_key = "settings.length.label"
  default = 56
  min = 16
  max = 160

  # No click action; declared so the tape is a hover target like the rest.
  [widget.actions]
  middle = "none"

[[widget]]
id = "spinner"
entry = "spinner.luau"
hover_highlight = false

  [[widget.setting]]
  key = "animate"
  type = "bool"
  label_key = "settings.animate.label"
  default = true

  [widget.actions]
  left = "exec $HOME/.local/bin/hud-overlay toggle"
  middle = "none"

[[widget]]
id = "barcode"
entry = "barcode.luau"
hover_highlight = false

[[widget]]
id = "workspaces"
entry = "workspaces.luau"
hover_highlight = false

  [widget.actions]
  middle = "none"

[[widget]]
id = "vol"
entry = "vol.luau"
hover_highlight = false

  # Draw the panel's acid tag in front of this readout (the first one in a pill).
  [[widget.setting]]
  key = "tag"
  type = "bool"
  label_key = "settings.tag.label"
  default = false

  [widget.actions]
  left = "panel-toggle control-center audio"
  middle = "volume-mute"
  scroll_up = "volume-up"
  scroll_down = "volume-down"

[[widget]]
id = "lum"
entry = "lum.luau"
hover_highlight = false

  # Draw the panel's acid tag in front of this readout (the first one in a pill).
  [[widget.setting]]
  key = "tag"
  type = "bool"
  label_key = "settings.tag.label"
  default = false

  [widget.actions]
  left = "panel-toggle control-center"
  middle = "none"
  scroll_up = "brightness-up"
  scroll_down = "brightness-down"

[[widget]]
id = "pwr"
entry = "pwr.luau"
hover_highlight = false

  # Draw the panel's acid tag in front of this readout (the first one in a pill).
  [[widget.setting]]
  key = "tag"
  type = "bool"
  label_key = "settings.tag.label"
  default = false

  [widget.actions]
  left = "panel-toggle control-center power"
  middle = "none"

[[widget]]
id = "msg"
entry = "msg.luau"
hover_highlight = false

  # Draw the panel's acid tag in front of this readout (the first one in a pill).
  [[widget.setting]]
  key = "tag"
  type = "bool"
  label_key = "settings.tag.label"
  default = false

  [widget.actions]
  left = "panel-toggle control-center notifications"
  middle = "none"

[[widget]]
id = "clock"
entry = "clock.luau"
hover_highlight = false

  # Noctalia clock format strings, as on the built-in clock widget.
  [[widget.setting]]
  key = "format"
  type = "string"
  label_key = "settings.format.label"
  default = "{:%H:%M}"

  [[widget.setting]]
  key = "tooltip_format"
  type = "string"
  label_key = "settings.tooltip_format.label"
  default = "{:%A %d %B %Y}"

  [widget.actions]
  left = "panel-toggle control-center calendar"
  middle = "none"

[[widget]]
id = "cc"
entry = "cc.luau"
hover_highlight = false

  [widget.actions]
  left = "panel-toggle control-center home"
  right = "panel-toggle control-center home"
  middle = "none"

[[widget]]
id = "sys"
entry = "sys.luau"
hover_highlight = false

  [widget.actions]
  left = "panel-toggle control-center system"
  middle = "none"

[[widget]]
id = "sep"
entry = "sep.luau"
hover_highlight = false

  [widget.actions]
  middle = "none"

[[widget]]
id = "title"
entry = "title.luau"
hover_highlight = false

  # Logical px left of the title: bar margin, the widgets before it and the
  # lane spacing, without the media readout.
  [[widget.setting]]
  key = "reserve"
  type = "int"
  label_key = "settings.title_reserve.label"
  default = 510
  min = 0
  max = 4000

  # Logical px the media readout takes at its max_length, spacing included.
  [[widget.setting]]
  key = "media_reserve"
  type = "int"
  label_key = "settings.media_reserve.label"
  default = 180
  min = 0
  max = 1000

  # Gap to the workspace row, as for the equalizer on its other side.
  [[widget.setting]]
  key = "gap"
  type = "int"
  label_key = "settings.gap.label"
  default = 13
  min = 0
  max = 200

  [widget.actions]
  middle = "none"

[[widget]]
id = "eq"
entry = "eq.luau"
hover_highlight = false

  # Noctalia streams PipeWire spectrum frames to onAudioSpectrum while this is on.
  [[widget.setting]]
  key = "audio_spectrum"
  type = "bool"
  label_key = "settings.audio_spectrum.label"
  default = true

  # Logical px right of the equalizer: the rest of the end lane plus margins.
  [[widget.setting]]
  key = "reserve"
  type = "int"
  label_key = "settings.reserve.label"
  default = 362
  min = 0
  max = 2000

  # Gap to the workspace row (layout px; the slanted caps add ~2 px of air),
  # tuned to match the gap on the row's other side.
  [[widget.setting]]
  key = "gap"
  type = "int"
  label_key = "settings.gap.label"
  default = 13
  min = 0
  max = 200

  # Widest the equalizer gets (logical px; 0 = always fill up to the workspace
  # gap). 286 matches the CPU/TMP/MEM panel, so it stays that size on the
  # ultrawides instead of spanning to the workspaces.
  [[widget.setting]]
  key = "max_width"
  type = "int"
  label_key = "settings.max_width.label"
  default = 286
  min = 0
  max = 4000

  [widget.actions]
  left = "panel-toggle control-center audio"
  middle = "none"
