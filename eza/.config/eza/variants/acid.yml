# ACID//HUD theme for eza. `dotfiles-theme acid` links it to
# ~/.config/eza/theme.yml; classic removes the link and eza falls back to its
# own defaults.
#
# The terminal is 45 % glass over the neon alley wallpaper, so the listing is
# coloured like the alley's signage rather than strictly from the UI palette
# (noctalia/.config/noctalia/palettes/acid-hud.json). Sampled from the picture
# and lifted until they read on the glass:
#   hologram  #ef5fc6 / #ff8fdc   magenta: directories, write bits, branches
#   haze      #b99cff / #9e91e6 / #5d4b85   violet: you, dates, read bits, chrome
#   signage   #ff8a5c orange, #ffb37a peach, #ffd166 amber: executables,
#             source, build files, modified, big sizes
#   mint      #8fe8c8 / #5fb39a   small sizes, execute bits, git new/clean, audio
#   medical   #7f8cff / #6a6fc4   the blue sign: keys, renames, inodes, objects
#   cyan      #9ee0ec / #72c8d8   symlinks and their targets
#   red       #ff4d5e / #ff7a8a   root, deleted, broken links, archives
#
# oh-my-zsh exports LS_COLORS from dircolors, and eza lets that beat a theme
# file for file kinds and extension globs, so .zshrc runs eza with LS_COLORS
# emptied under the acid theme.
colourful: true

filekinds:
  normal: {foreground: "#efe7f4"}
  directory: {foreground: "#ef5fc6", is_bold: true}
  symlink: {foreground: "#9ee0ec"}
  pipe: {foreground: "#ffd166"}
  block_device: {foreground: "#ff8a5c", is_bold: true}
  char_device: {foreground: "#ff8a5c", is_bold: true}
  socket: {foreground: "#ff8fdc", is_bold: true}
  special: {foreground: "#ffd166"}
  executable: {foreground: "#ff8a5c", is_bold: true}
  mount_point: {foreground: "#ef5fc6", is_bold: true, is_underline: true}

# Read is the violet haze, write the hologram, execute a mint sign; only the
# owner's triplet is bold so the eye lands on it first.
perms:
  user_read: {foreground: "#b99cff", is_bold: true}
  user_write: {foreground: "#ef5fc6", is_bold: true}
  user_execute_file: {foreground: "#8fe8c8", is_bold: true, is_underline: true}
  user_execute_other: {foreground: "#8fe8c8", is_bold: true}
  group_read: {foreground: "#9e91e6"}
  group_write: {foreground: "#d06bb4"}
  group_execute: {foreground: "#5fb39a"}
  other_read: {foreground: "#9e91e6"}
  other_write: {foreground: "#d06bb4"}
  other_execute: {foreground: "#5fb39a"}
  special_user_file: {foreground: "#ffd166"}
  special_other: {foreground: "#ffd166"}
  attribute: {foreground: "#5d4b85"}

# Sizes heat up like the signs: mint, amber past a megabyte, orange past a
# gigabyte, red beyond.
size:
  major: {foreground: "#8fe8c8", is_bold: true}
  minor: {foreground: "#5fb39a"}
  number_byte: {foreground: "#5fb39a"}
  number_kilo: {foreground: "#8fe8c8"}
  number_mega: {foreground: "#ffd166", is_bold: true}
  number_giga: {foreground: "#ff8a5c", is_bold: true}
  number_huge: {foreground: "#ff4d5e", is_bold: true}
  unit_byte: {foreground: "#5d4b85"}
  unit_kilo: {foreground: "#5fb39a"}
  unit_mega: {foreground: "#ffd166"}
  unit_giga: {foreground: "#ff8a5c"}
  unit_huge: {foreground: "#ff4d5e"}

users:
  user_you: {foreground: "#b99cff"}
  user_root: {foreground: "#ff4d5e", is_bold: true}
  user_other: {foreground: "#ffb37a"}
  group_yours: {foreground: "#7d6bb8"}
  group_other: {foreground: "#b7a8c9"}
  group_root: {foreground: "#ff4d5e"}

links:
  normal: {foreground: "#5d4b85"}
  multi_link_file: {foreground: "#ffd166", is_bold: true}

git:
  new: {foreground: "#8fe8c8"}
  modified: {foreground: "#ffd166"}
  deleted: {foreground: "#ff4d5e"}
  renamed: {foreground: "#7f8cff"}
  typechange: {foreground: "#ef5fc6"}
  ignored: {foreground: "#5d4b85"}
  conflicted: {foreground: "#ff4d5e", is_bold: true}

git_repo:
  branch_main: {foreground: "#ef5fc6"}
  branch_other: {foreground: "#ff8fdc"}
  git_clean: {foreground: "#8fe8c8"}
  git_dirty: {foreground: "#ffd166"}

security_context:
  colon: {foreground: "#5d4b85"}
  user: {foreground: "#b99cff"}
  role: {foreground: "#8fe8c8"}
  typ: {foreground: "#ffb37a"}
  range: {foreground: "#72c8d8"}

file_type:
  image: {foreground: "#e08ae6"}
  video: {foreground: "#b99cff", is_bold: true}
  music: {foreground: "#8fe8c8"}
  lossless: {foreground: "#8fe8c8", is_bold: true}
  crypto: {foreground: "#7f8cff", is_bold: true}
  document: {foreground: "#d9cfe6"}
  compressed: {foreground: "#ff7a8a"}
  temp: {foreground: "#5d4b85"}
  compiled: {foreground: "#6a6fc4"}
  build: {foreground: "#ffd166", is_bold: true, is_underline: true}
  source: {foreground: "#ffb37a"}

punctuation: {foreground: "#5d4b85"}
date: {foreground: "#9e91e6"}
inode: {foreground: "#7f8cff"}
blocks: {foreground: "#72c8d8"}
header: {foreground: "#b99cff", is_underline: true}
octal: {foreground: "#7f8cff"}
flags: {foreground: "#9e91e6"}

symlink_path: {foreground: "#72c8d8"}
control_char: {foreground: "#ff4d5e"}
broken_symlink: {foreground: "#ff4d5e"}
broken_path_overlay: {foreground: "#ff7a8a", is_underline: true}
