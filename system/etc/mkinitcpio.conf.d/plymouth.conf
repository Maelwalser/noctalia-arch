# Boot splash: put the plymouth hook right after systemd (or udev), where the
# Arch wiki wants it, whatever the rest of HOOKS in /etc/mkinitcpio.conf is.
# Skipped while the plymouth package is not installed, so the image still builds.
if [[ -f /usr/lib/initcpio/install/plymouth ]]; then
  _hooks=()
  for _hook in "${HOOKS[@]}"; do
    [[ "$_hook" == plymouth ]] && continue
    _hooks+=("$_hook")
    [[ "$_hook" == systemd || "$_hook" == udev ]] && _hooks+=(plymouth)
  done
  HOOKS=("${_hooks[@]}")
  unset _hooks _hook
fi
