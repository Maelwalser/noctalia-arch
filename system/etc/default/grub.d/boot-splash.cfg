# Sourced by grub-mkconfig after /etc/default/grub.
# No menu: GRUB waits one second without drawing anything, then boots the
# default entry. To get the menu, hold Esc from the firmware logo on. (With a
# timeout of 0 GRUB looks for the key exactly once, which is nearly impossible
# to hit on UEFI.)
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
# Plymouth only shows its splash when the kernel is booted with `splash`.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash"
